name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Update last-deployed timestamp in README
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT=$(git log -1 --pretty=format:'%h — %s')
          # Append or update deploy badge line
          if grep -q "<!-- LAST_DEPLOY -->" README.md; then
            sed -i "s|<!-- LAST_DEPLOY -->.*|<!-- LAST_DEPLOY --> \`${TIMESTAMP}\` · commit \`${COMMIT}\`|" README.md
          else
            echo "" >> README.md
            echo "<!-- LAST_DEPLOY --> \`${TIMESTAMP}\` · commit \`${COMMIT}\`" >> README.md
          fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: auto-update deploy timestamp [skip ci]"
          git push origin main || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
